<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1712">
<title>삼국쟁투 · Battle of Three Kingdoms</title>
<style>:root {
  --ink: #1b1712; --paper: #efe4cc; --paper2: #e3d4b3; --line: #8a7656; --red: #a8321e; --red2: #c9452c;
  --muted: #6b5d48; --good: #2f7a46; --warn: #b5651d; --shadow: 0 6px 24px rgba(0,0,0,.35);
  --font: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
  --ui: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--ink); font-family: var(--ui); overflow: hidden; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--paper2); color: var(--ink); border-radius: 6px; padding: 8px 12px; }
button:disabled { opacity: .45; cursor: default; }
button.big { font-family: var(--font); font-size: 18px; font-weight: 700; padding: 12px 22px; background: var(--red); color: #fff4e0; border-color: #6e1e10; }
button.ghost { background: transparent; color: var(--paper); border-color: var(--paper); }
button.icon { background: transparent; border: none; color: var(--paper); font-size: 22px; padding: 4px 10px; }
button.sm { padding: 5px 9px; font-size: 13px; }
button.pri { background: var(--red); color: #fff4e0; border-color: #6e1e10; }
select, input[type=range] { font: inherit; max-width: 100%; }
select { padding: 5px; border-radius: 5px; border: 1px solid var(--line); background: #fbf5e8; }
.hidden { display: none !important; }
#app { position: fixed; inset: 0; }
.screen { position: absolute; inset: 0; }

#title { background: radial-gradient(ellipse at 50% 30%, #3a2e22, #14110d 70%); color: var(--paper); display: flex; flex-direction: column; align-items: center; padding: 6vh 16px 16px; overflow-y: auto; text-align: center; }
#title h1 { font-family: var(--font); font-size: clamp(40px, 11vw, 72px); margin: 8px 0 4px; letter-spacing: .12em; color: #f5e6c8; text-shadow: 0 3px 0 #000; }
#seal { width: 72px; height: 72px; image-rendering: pixelated; }
.en { margin: 0 0 6px; color: #c9b791; letter-spacing: .2em; font-size: 13px; text-transform: uppercase; }
.sub { color: #c9b791; margin: 0 0 24px; }
.menu { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#pick { width: 100%; max-width: 760px; margin-top: 18px; }
#pick h2 { font-family: var(--font); font-size: 18px; color: #f0dfbd; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.fcard { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 10px; text-align: left; border: 2px solid transparent; }
.fcard:hover { border-color: var(--red2); }
.fcard b { font-family: var(--font); font-size: 17px; }
.fcard .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: middle; border: 1px solid #0006; }
.fcard small { display: block; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.opt { display: block; margin: 16px 0; color: #e8d8b8; }

#game { background: #2a241c; display: flex; flex-direction: column; }
#top { display: flex; align-items: center; gap: 10px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); background: #15120e; color: var(--paper); border-bottom: 2px solid #3d3326; }
#top .when { font-family: var(--font); white-space: nowrap; }
#top .when span { color: #c9b791; font-size: 14px; }
#res { flex: 1; min-width: 0; font-size: 13px; color: #d9c8a4; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: right; }
#mapWrap { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }
.end { font-family: var(--font); font-weight: 700; background: var(--red); color: #fff4e0; border-color: #6e1e10; padding: 7px 14px; white-space: nowrap; }
#sieges { position: absolute; left: 8px; top: 8px; z-index: 4; display: flex; flex-direction: column; gap: 6px; max-width: min(360px, calc(100% - 16px)); }
.scard { background: var(--paper); border-radius: 8px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 13px; border-left: 4px solid var(--red); }
.scard .row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.scard b { font-family: var(--font); }
.scard.on { outline: 2px solid var(--warn); }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 56%; overflow-y: auto; background: var(--paper); z-index: 6; border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.45); padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) { .sheet { left: auto; top: 54px; width: 420px; max-height: none; border-radius: 0; } }
@media (max-width: 560px) { #res { display: none; } #top { flex-wrap: nowrap; } #top .when { flex: 1; } }
.sheet h3 { font-family: var(--font); margin: 0; font-size: 22px; }
.hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.hd .close { margin-left: auto; }
.tag { font-size: 12px; padding: 2px 7px; border-radius: 10px; background: var(--paper2); border: 1px solid var(--line); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.stats div { background: #f8f0dd; border: 1px solid #d8c7a2; border-radius: 6px; padding: 5px 6px; font-size: 12px; color: var(--muted); }
.stats b { display: block; color: var(--ink); font-size: 15px; }
.bar { height: 4px; background: #d8c7a2; border-radius: 2px; margin-top: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red2); }
.sec { margin-top: 12px; }
.sec > h4 { margin: 0 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
.gen { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 7px 0; border-top: 1px dashed #cdb98f; }
.gen .nm { font-family: var(--font); font-weight: 700; }
.gen .st { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.gen select { max-width: 150px; }
.apt { font-weight: 700; }
.apt.S { color: #b0177e; } .apt.A { color: var(--red); } .apt.B { color: var(--ink); } .apt.C { color: #8a8a8a; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0; line-height: 1.45; }

.modal { position: fixed; inset: 0; z-index: 20; background: rgba(10,8,6,.72); display: flex; align-items: center; justify-content: center; padding: 10px; }
.modal .box { background: var(--paper); border-radius: 12px; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; padding: 14px; box-shadow: var(--shadow); }
.modal h3 { font-family: var(--font); margin: 0 0 8px; }
.urow { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; padding: 8px 0; border-top: 1px dashed #cdb98f; }
.urow .ctl { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.urow input[type=range] { flex: 1; min-width: 120px; }
.log { font-size: 14px; line-height: 1.5; }
.log p { margin: 4px 0; padding-left: 8px; border-left: 3px solid #cdb98f; }
.log p.big { border-color: var(--red); font-weight: 700; }
.log p.war { border-color: var(--warn); }
.log p.good { border-color: var(--good); }
.log p.death { border-color: #555; color: #555; }
#bcanvas { width: 100%; background: #6d7f4a; border-radius: 6px; image-rendering: pixelated; display: block; }
.bhud { display: flex; justify-content: space-between; font-size: 13px; margin: 6px 0; gap: 8px; }
.bhud b { font-family: var(--font); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; pointer-events: none; width: min(92vw, 460px); }
#toast div { background: #15120ee6; color: var(--paper); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mini td, table.mini th { padding: 4px; border-bottom: 1px solid #d8c7a2; text-align: left; }

/* ---------- 튜토리얼 ---------- */
#tut { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 7; background: #fbf3df; border: 2px solid #c9a24a; border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); }
@media (min-width: 900px) { #tut { top: auto; bottom: 16px; right: auto; width: 400px; } }
.tutline { display: flex; gap: 10px; align-items: flex-start; }
.tutline .face { width: 48px; height: 48px; image-rendering: pixelated; flex: none; background: #e9dcbd; border-radius: 6px; border: 1px solid #c9a24a; }
.tutline p { margin: 0; }
#tut .say { font-family: var(--font); font-size: 14px; line-height: 1.45; }
#tut .todo { margin-top: 5px; font-weight: 700; color: var(--red); font-size: 14px; }
.tutbar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.tutbar button { margin-left: 6px; }
.tutline.tip { background: #fbf3df; border: 1px solid #c9a24a; border-radius: 8px; padding: 6px 8px; margin: 6px 0 10px; font-size: 14px; }
.tutline.tip .face { width: 36px; height: 36px; }
.tut-hl { outline: 3px solid #f2b51e !important; outline-offset: 2px; animation: tutglow 1s ease-in-out infinite alternate; }
@keyframes tutglow { from { outline-color: #f2b51e; } to { outline-color: #fff1b0; } }
#tut.shake { animation: tutshake .35s; }
@keyframes tutshake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.badge { font-size: 12px; background: #c9a24a; color: #1b1712; padding: 2px 7px; border-radius: 10px; font-family: var(--ui); }
#top .when .badge { color: #1b1712; font-weight: 700; }
@media (max-width: 899px) { #game.panel-open #sieges { display: none; } .scard { font-size: 12px; padding: 6px 8px; } }
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen">
    <canvas id="seal" width="48" height="48"></canvas>
    <h1>삼국쟁투</h1>
    <p class="en">Battle of Three Kingdoms</p>
    <p class="sub">후한 말, 천하를 다투는 턴제 전략 · <span id="ver"></span></p>
    <div class="menu">
      <button id="btnNew" class="big">새 게임</button>
      <button id="btnLoad" class="big ghost">이어하기</button>
      <button id="btnTut" class="big ghost">튜토리얼</button>
    </div>
    <div id="pick" class="hidden">
      <h2>191년, 어느 군웅으로 나서겠습니까?</h2>
      <div id="factions" class="grid"></div>
      <label class="opt"><input type="checkbox" id="optVirtual" checked> 가상 인재 등장 (끄면 역사 인물만)</label>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header id="top">
      <div class="when"><b id="date"></b> <span id="fname"></span> <span id="tutBadge" class="badge hidden">연습 중(휴전)</span></div>
      <div class="res" id="res"></div>
      <button id="btnEnd" class="end">턴 종료</button>
      <button id="btnMenu" class="icon" aria-label="메뉴">☰</button>
    </header>
    <div id="mapWrap"><canvas id="map"></canvas><div id="sieges"></div><div id="tut" class="hidden"></div></div>
    <div id="panel" class="sheet hidden"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
  <div id="toast"></div>
</div>

  // ---------- 난수 ----------
  function makeRng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  function grng(G) {
    return function () {
      const r = makeRng(G.rs)();
      G.rs = (G.rs * 1664525 + 1013904223) >>> 0;
      return r;
    };
  }
  // 한국어 조사: 받침이 있으면 a, 없으면 b
  function J(w, a, b) {
    w = String(w); const ch = w.charCodeAt(w.length - 1);
    if (ch < 0xAC00 || ch > 0xD7A3) return w + a + '(' + b + ')';
    return w + ((ch - 0xAC00) % 28 ? a : b);

  const TUT_STEPS = [

    { id: 'siege', say: '성은 곧바로 치지 않고 먼저 에워쌉니다. 에워쌀수록 성안의 식량과 사기가 떨어집니다.', todo: '「턴 종료」를 누르세요(포위 2턴째까지)', endTurn: true },
    { id: 'assault', say: '포위 판에 「지금 치면 예상 승률」이 보입니다. 이만하면 충분합니다.', todo: '포위 판의 「공격」을 누르고 「턴 종료」', endTurn: true },

  ];
  const TUT_SIEGE_TURNS = 2;
  function tutDone(G) { if (G.tut) { G.tut.protect = false; G.tut.done = true; } }
  // 5단계에서 징병을 맡길 장수: 하후돈, 없으면 진류에서 통솔이 가장 높은 장수
  function tutRecruiter(G) {
    const here = officersIn(G, 'chenliu');

  const tutStepId = G => (G.tut && !G.tut.done ? TUT_STEPS[G.tut.step - 1].id : null);

  function tutCheck(G, ev) {
    const id = tutStepId(G);
    if (!id) return false;
    const before = G.tut.step;
    const go = n => { G.tut.step = n; };
    const siege = G.sieges.find(s => s.att === 'cao' && s.to === 'xuchang');
    const won = G.cities.xuchang.owner === 'cao';
    switch (id) {
      case 'intro': case 'hud': case 'stats': if (ev.type === 'next') go(before + 1); break;

        } else {
          g.faction = null;
          addLog(G, `${G.cities[g.city].name}에 ${J(g.name, '이', '가')} 재야로 나타났습니다.`);
        }
      }
    }
    yearlyTalent(G, rng);
  }
  function killGen(G, g) {
    g.alive = false; g.dead = true;
    const f = g.faction && G.factions[g.faction];
    addLog(G, `${J(g.name, '이', '가')} 세상을 떠났습니다.`, 'death');
    if (g.army) {
      const s = G.sieges.find(x => x.id === g.army);
      if (s) s.units = s.units.filter(u => u.gen !== g.id);
    }
    g.army = null;
    if (f && f.ruler === g.id) succeed(G, f, g);
  }
  function succeed(G, f, old) {
    const cands = Object.values(G.gens).filter(x => x.alive && x.faction === f.id);
    if (!cands.length) { destroyFaction(G, f); return; }
    const heirs = cands.filter(x => x.parent === old.id).sort((a, b) => a.birth - b.birth);
    const next = heirs[0] || cands.sort((a, b) => b.lead - a.lead)[0];
    f.ruler = next.id;
    f.name = next.name;
    addLog(G, `${J(next.name, '이', '가')} 뒤를 이어 군주가 되었습니다.`, 'big');
  }
  function destroyFaction(G, f) {
    f.alive = false;
    for (const c of citiesOf(G, f.id)) { c.owner = null; c.direct = false; }
    for (const g of Object.values(G.gens)) if (g.faction === f.id) { g.faction = null; g.task = 'rest'; g.army = null; }
    G.sieges = G.sieges.filter(s => s.att !== f.id);
    addLog(G, `${f.name} 세력이 멸망했습니다.`, 'big');
  }

  // ---------- 장수 할 일 ----------
  const TASKS = {
    rest: '대기', agri: '농업 개발', comm: '상업 개발', wall: '성벽 보수', recruit: '징병', train: '훈련',
    search: '인재 탐색', hire: '등용', sabotage: '파괴공작', move: '이동',
  };
  function setTask(G, genId, task, arg) {
    const g = G.gens[genId];
    if (!g || !g.alive || g.army || !TASKS[task]) return false;
    g.task = task; g.arg = arg == null ? null : arg;
    return true;
  }
  function runTask(G, g, rng) {
    const c = G.cities[g.city];
    if (!c || c.owner !== g.faction) return;
    const besieged = G.sieges.some(s => s.to === c.id);
    switch (g.task) {
      case 'agri': if (c.gold >= 100) { c.gold -= 100; c.agri = Math.min(c.agriMax, c.agri + Math.round(6 + g.pol / 10)); } break;
      case 'comm': if (c.gold >= 100) { c.gold -= 100; c.comm = Math.min(c.commMax, c.comm + Math.round(6 + g.pol / 10)); } break;
      case 'wall': if (c.gold >= 150) { c.gold -= 150; c.wall = Math.min(c.wallMax, c.wall + Math.round(100 + g.pol * 2)); } break;
      case 'recruit': if (!besieged) doRecruit(G, c, g); break;
      case 'train': c.train = Math.min(100, c.train + Math.round(4 + g.lead / 20)); break;
      case 'search':
        if (G.opts.virtual && rng() < 0.15 + g.int / 500) {
          const v = makeVirtual(c.region, c.id, rng, G.year); G.gens[v.id] = v;
          if (c.owner === G.playerFaction) addLog(G, `${J(g.name, '이', '가')} ${c.name}에서 ${J(v.name, '을', '를')} 찾아냈습니다.`);
        }
        g.task = 'rest'; break;
      case 'hire': {
        const t = G.gens[g.arg];
        if (t && t.alive && !t.faction && t.city === c.id) {
          const p = 0.35 + (g.pol - 50) / 150 + (t.virtual ? 0.15 : 0);
          if (rng() < p) {
            t.faction = c.owner; t.task = 'rest';
            addLog(G, `${J(t.name, '이', '가')} ${G.factions[c.owner].name} 세력에 합류했습니다.`, c.owner === G.playerFaction ? 'good' : 'info');
          } else if (c.owner === G.playerFaction) addLog(G, `${t.name} 등용에 실패했습니다.`);
        }
        g.task = 'rest'; g.arg = null; break;
      }
      case 'sabotage': {
        const t = G.cities[g.arg];
        if (t && t.owner !== c.owner && c.adj.includes(t.id) && c.gold >= 200) {
          c.gold -= 200;
          const r = sabotage(G, g, t, rng, G.sieges.some(s => s.to === t.id && s.att === c.owner));
          if (c.owner === G.playerFaction) addLog(G, r.ok ? `${g.name}의 파괴공작으로 ${t.name} 성벽이 ${r.dmg} 깎였습니다.` : `${g.name}의 ${t.name} 파괴공작이 들켰습니다.`);
        }
        g.task = 'rest'; g.arg = null; break;
      }
      case 'move': {
        const t = G.cities[g.arg];
        if (t && t.owner === g.faction) g.city = t.id;
        g.task = 'rest'; g.arg = null; break;
      }
    }
  }

  // ---------- 위임 AI (적 AI와 같은 코드) ----------
  function powerOf(troops, gens) {
    if (!gens.length) return troops * 0.75;
    const avg = gens.reduce((s, g) => s + (g.lead + g.war) / 200, 0) / gens.length;
    return troops * (0.5 + avg);
  }
  function defenseOf(G, c) {
    return powerOf(c.troops, officersIn(G, c.id).slice(0, 4)) * (1 + 0.8 * c.wall / 4000);
  }
  function attackPotential(G, c) {
    const offs = officersIn(G, c.id).sort((a, b) => b.lead - a.lead).slice(0, 4);
    return powerOf(Math.min(c.troops * 0.7, offs.reduce((s, g) => s + unitCap(g), 0)), offs);
  }
  function aiPolicy(G, c) {
    const fronts = c.adj.map(id => G.cities[id]).filter(o => isEnemy(G, c, o));
    if (!fronts.length) return { policy: 'dev' };
    if (c.troops < 15000) return { policy: 'mil' };
    if (c.owner !== G.playerFaction) {
      const mine = attackPotential(G, c);
      const tgt = fronts.filter(o => !isProtected(G, o.id)).map(o => ({ o, d: defenseOf(G, o) })).sort((a, b) => a.d - b.d)[0];
      if (tgt && mine > tgt.d * AI_ATK_POLICY) return { policy: 'atk', target: tgt.o.id };
    }
    return { policy: c.troops < c.pop * RECRUIT_CAP * 0.7 ? 'mil' : 'def' };
  }
  function effectivePolicy(G, c) {
    if (c.policy === 'auto' || c.owner !== G.playerFaction) return aiPolicy(G, c);
    if (c.policy === 'atk' && !(c.target && G.cities[c.target] && G.cities[c.target].owner !== c.owner && c.adj.includes(c.target))) return { policy: 'mil' };
    return { policy: c.policy, target: c.target };
  }
  function planCity(G, cityId) {
    const c = G.cities[cityId];
    if (!c.owner || c.direct) return null;
    const pol = effectivePolicy(G, c);
    c.cur = pol;
    const offs = officersIn(G, cityId).sort((a, b) => b.pol - a.pol);
    if (!offs.length) return pol;
    const ronin = roninIn(G, cityId).sort((a, b) => (b.lead + b.war + b.int) - (a.lead + a.war + a.int));
    const free = offs.slice();
    const take = (sorter) => { free.sort(sorter); return free.shift(); };
    if (ronin.length && free.length) { const g = take((a, b) => b.pol - a.pol); g.task = 'hire'; g.arg = ronin[0].id; }
    const canRecruit = c.loyalty >= 35 && c.pop > 40000 && c.troops < c.pop * RECRUIT_CAP && c.gold > 300;
    const devTask = () => (c.agri / c.agriMax <= c.comm / c.commMax ? 'agri' : 'comm');
    if (pol.policy === 'dev') {
      if (free.length && c.wall < c.wallMax * 0.6) { const g = take((a, b) => b.pol - a.pol); g.task = 'wall'; }
      for (const g of free) g.task = devTask();
      if (free.length >= 3 && G.opts.virtual && gensIn(G, c.id).length < 4) free[free.length - 1].task = 'search';
    } else {
      if (free.length && canRecruit) { const g = take((a, b) => b.lead - a.lead); g.task = 'recruit'; }
      if (pol.policy === 'def' && free.length && c.wall < c.wallMax) { const g = take((a, b) => b.pol - a.pol); g.task = 'wall'; }
      for (const g of free) g.task = c.train < 85 ? 'train' : (c.gold < 800 ? 'comm' : devTask());
      if (!canRecruit && free.length > 1 && c.gold < 600) free[0].task = 'comm';
    }
    for (const g of offs) if (g.task !== 'hire' && g.task !== 'sabotage') g.arg = null;
    return pol;
  }

  function aiMilitary(G, rng) {
    for (const c of Object.values(G.cities)) {
      if (!c.owner || c.direct || !c.cur || c.cur.policy !== 'atk') continue;
      if (c.owner === G.playerFaction && c.policy !== 'atk') continue;
      const t = G.cities[c.cur.target];
      if (t && c.owner !== G.playerFaction && isProtected(G, t.id)) continue;
      if (!t || t.owner === c.owner || G.sieges.some(s => s.from === c.id || (s.to === t.id && s.att === c.owner))) continue;
      const offs = officersIn(G, c.id).sort((a, b) => (b.lead + b.war) - (a.lead + a.war));
      if (!offs.length) continue;
      const n = Math.min(4, offs.length > 1 ? offs.length - (offs.length > 2 ? 1 : 0) : 1);
      const pickG = offs.slice(0, n);
      const pool = Math.round(c.troops * 0.55);
      // 비운 성을 이웃이 노리지 않을 만큼은 남긴다
      const threat = c.adj.map(id => G.cities[id]).filter(o => o.owner && o.owner !== c.owner && o.id !== t.id).reduce((m, o) => Math.max(m, attackPotential(G, o)), 0);
      if (powerOf(c.troops - pool, officersIn(G, c.id).slice(n, n + 2)) * (1 + 0.8 * c.wall / 4000) < threat * 0.35) continue;
      const capSum = pickG.reduce((s, g) => s + unitCap(g), 0);
      const units = pickG.map(g => ({ gen: g.id, type: bestType(g), troops: Math.round(Math.min(unitCap(g), pool * unitCap(g) / capSum)) }));
      if (powerOf(units.reduce((s, u) => s + u.troops, 0), pickG) < defenseOf(G, t) * AI_ATK_GO * (0.85 + 0.3 * rng())) continue;
      const s = launchAttack(G, c.id, t.id, units, 'normal');
      if (s) s.auto = true;
    }
  }

  // AI 세력: 장수가 몰린 후방 도시에서 장수가 모자란 전선 도시로 한 명씩 보낸다
  function aiShuffle(G) {
    for (const f of Object.values(G.factions)) {
      if (!f.alive || f.id === G.playerFaction) continue;
      const cs = citiesOf(G, f.id);
      if (cs.length < 2) continue;
      const front = c => c.adj.some(id => G.cities[id].owner !== f.id);
      const need = cs.filter(c => !G.sieges.some(s => s.to === c.id)).sort((a, b) => officersIn(G, a.id).length - officersIn(G, b.id).length)[0];
      const give = cs.slice().sort((a, b) => (officersIn(G, b.id).length - (front(b) ? 2 : 0)) - (officersIn(G, a.id).length - (front(a) ? 2 : 0)))[0];
      if (!need || !give || need === give) continue;
      const nGive = officersIn(G, give.id).length, nNeed = officersIn(G, need.id).length;
      if (nGive - nNeed < 2) continue;
      const g = officersIn(G, give.id).filter(x => x.id !== f.ruler).sort((a, b) => (b.lead + b.war) - (a.lead + a.war))[0];
      if (g) g.city = need.id;
    }
  }

  // 출진 창 기본값(화면·튜토리얼·시험이 같은 값을 쓴다): 통솔+무력 상위 3명, 각자 잘 맞는 병종, 성 병력 60%를 통솔 한도 비례로
  function defaultArmy(G, fromId) {
    const c = G.cities[fromId];
    const offs = officersIn(G, fromId).sort((a, b) => (b.lead + b.war) - (a.lead + a.war)).slice(0, 3);
    if (!offs.length) return [];
    const pool = Math.floor(c.troops * 0.6);
    const cap = offs.reduce((a, g) => a + unitCap(g), 0);
    return offs.map(g => ({ gen: g.id, type: bestType(g), troops: Math.max(100, Math.min(unitCap(g), Math.floor(pool * unitCap(g) / cap / 100) * 100)) }));
  }

  // ---------- 출진과 포위 ----------
  function launchAttack(G, fromId, toId, units, tactic) {
    const from = G.cities[fromId], to = G.cities[toId];
    if (!from || !to || !from.owner || from.owner === to.owner || !from.adj.includes(toId)) return null;
    if (G.sieges.some(s => s.to === toId && s.att === from.owner)) return null;
    if (!units.length || units.length > 4) return null;
    let total = 0;
    for (const u of units) {
      const g = G.gens[u.gen];
      if (!g || !g.alive || g.faction !== from.owner || g.city !== fromId || g.army) return null;
      if (!DATA.UNIT[u.type] || u.troops < 100 || u.troops > unitCap(g)) return null;
      total += u.troops;
    }
    if (total > from.troops) return null;
    from.troops -= total;
    const s = {
      id: G.nextSiege++, att: from.owner, from: fromId, to: toId, tactic: tactic || 'normal',
      units: units.map(u => ({ gen: u.gen, type: u.type, troops: Math.round(u.troops), train: from.train })),
      turns: 0, defMorale: 100, attMorale: 100, order: 'hold', auto: false, fresh: true,
    };
    for (const u of s.units) { const g = G.gens[u.gen]; g.army = s.id; g.task = 'rest'; g.arg = null; }
    G.sieges.push(s);
    addLog(G, `${G.factions[from.owner].name} 군이 ${from.name}에서 출진해 ${J(to.name, '을', '를')} 포위했습니다.`, (from.owner === G.playerFaction || to.owner === G.playerFaction) ? 'war' : 'info');
    return s;
  }
  function siegeOrder(G, siegeId, order) {
    const s = G.sieges.find(x => x.id === siegeId);
    if (!s || !['hold', 'assault', 'retreat', 'sabotage'].includes(order)) return false;
    s.order = order; return true;
  }
  function tickSieges(G) {
    for (const s of G.sieges) {
      const c = G.cities[s.to];
      c.food = Math.max(0, c.food - Math.max(800, Math.round(c.troops * 0.08)));
      s.defMorale = clamp(s.defMorale - 8 - (c.food <= 0 ? 15 : 0), 20, 100);
      const from = G.cities[s.from];
      const need = Math.round(s.units.reduce((a, u) => a + u.troops, 0) * 0.06);
      if (from.owner === s.att && from.food >= need) from.food -= need;
      else s.attMorale = clamp(s.attMorale - 15, 0, 100);
      s.turns++;
    }
  }
  const armyTroops = s => s.units.reduce((a, u) => a + u.troops, 0);
  function toBattleUnits(G, list) {
    return list.map(u => ({ gen: Object.assign({}, G.gens[u.gen] || u.genObj), type: u.type, troops: u.troops, train: u.train }));
  }
  function defenderUnits(G, c, forSiege) {
    const offs = officersIn(G, c.id).sort((a, b) => (b.lead + b.war) - (a.lead + a.war)).slice(0, 4);
    if (!offs.length) {
      return c.troops > 0 ? [{ gen: '_militia', genObj: militia(c), type: forSiege ? 'arc' : 'inf', troops: c.troops, train: c.train }] : [];
    }
    const per = Math.floor(c.troops / offs.length);
    return offs.map(g => ({ gen: g.id, type: bestType(g, forSiege), troops: per, train: c.train }));
  }
  const militia = c => ({ id: '_militia', name: c.name + ' 향병', lead: 45, war: 45, int: 30, pol: 30, apt: { inf: 'B', arc: 'B', cav: 'C' } });

  function estimateAssault(G, s, rng) {
    const c = G.cities[s.to];
    const att = toBattleUnits(G, s.units), def = toBattleUnits(G, defenderUnits(G, c, true));
    if (!def.length) return 1;
    let wins = 0;
    for (let i = 0; i < 3; i++) {
      const r = simulateBattle(att, def, siegeCtx(c, s), makeRng(Math.floor(rng() * 1e9)), true);
      if (r.winner === 0) wins++;
    }
    return wins / 3;
  }
  // 지금 성을 치면 이길 확률(같은 규칙으로 n번 돌려 본 값). 화면의 「예상 승률」에 쓴다
  function assaultOdds(G, s, n) {
    const c = G.cities[s.to];
    const def = toBattleUnits(G, defenderUnits(G, c, true));
    if (!def.length) return 1;
    const att = toBattleUnits(G, s.units);
    let w = 0;
    for (let i = 0; i < n; i++) if (simulateBattle(att, def, siegeCtx(c, s), makeRng(1000 + i * 97 + G.turn), true).winner === 0) w++;
    return w / n;
  }
  const siegeCtx = (c, s) => ({ siege: true, wall: c.wall, wallMax: c.wallMax, defMorale: s.defMorale, attMorale: s.attMorale, tactic: s.tactic });

  function resolveSieges(G, rng) {
    for (const s of G.sieges.slice()) {
      if (!G.sieges.includes(s)) continue;
      const c = G.cities[s.to];
      if (!s.units.length || c.owner === s.att) { endSiege(G, s, 'home'); continue; }
      if (G.factions[s.att] && !G.factions[s.att].alive) { G.sieges = G.sieges.filter(x => x !== s); continue; }
      const playerArmy = s.att === G.playerFaction && !s.auto;
      const involvesPlayer = s.att === G.playerFaction || c.owner === G.playerFaction;
      // 수비 측 출격(구원군 포함) — 수비 판단도 위임 AI가 같은 규칙으로 한다
      if (!s.fresh && c.owner) {
        const relief = c.adj.map(id => G.cities[id]).filter(o => o.owner === c.owner && !G.sieges.some(x => x.to === o.id) && o.troops > 15000 && officersIn(G, o.id).length)
          .sort((a, b) => b.troops - a.troops)[0];
        const defU = defenderUnits(G, c, false).slice(0, relief ? 2 : 4);
        let relU = [];
        if (relief) {
          const ro = officersIn(G, relief.id).sort((a, b) => (b.lead + b.war) - (a.lead + a.war)).slice(0, 2);
          const pool = Math.round(relief.troops * 0.6);
          relU = ro.map(g => ({ gen: g.id, type: bestType(g), troops: Math.min(unitCap(g), Math.floor(pool / ro.length)), train: relief.train, from: relief.id }));
        }
        const field = defU.concat(relU);
        const fieldGens = field.map(u => G.gens[u.gen] || militia(c));
        const fieldPow = powerOf(field.reduce((a, u) => a + u.troops, 0), fieldGens);
        const attPow = powerOf(armyTroops(s), s.units.map(u => G.gens[u.gen]));
        if (field.length && fieldPow > attPow * 1.3) {
          const r = simulateBattle(toBattleUnits(G, s.units), toBattleUnits(G, field), { siege: false, tactic: s.tactic, attMorale: s.attMorale }, makeRng(Math.floor(rng() * 1e9)));
          const defOwner = c.owner;
          applyField(G, s, c, field, r);
          if (involvesPlayer) G.replays.push({ title: `${c.name} 출격전`, result: r, att: s.att, def: defOwner });
          continue;
        }
      }
      if (s.fresh) { s.fresh = false; continue; } // 도착한 턴에는 포위만 한다
      let order = s.order;
      if (!playerArmy) order = aiSiegeOrder(G, s, rng);
      if (order === 'retreat' || s.attMorale <= 0) { endSiege(G, s, 'retreat'); continue; }
      if (order === 'sabotage') {
        const g = s.units.map(u => G.gens[u.gen]).sort((a, b) => b.int - a.int)[0];
        const r = sabotage(G, g, c, rng, true);
        if (involvesPlayer) addLog(G, r.ok ? `${g.name}의 파괴공작으로 ${c.name} 성벽이 ${r.dmg} 깎였습니다(내구 ${c.wall}).` : `${g.name}의 ${c.name} 파괴공작이 실패했습니다.`, 'war');
        if (playerArmy) s.order = 'hold';
        continue;
      }
      if (order !== 'assault') continue;
      if (playerArmy) s.order = 'hold';
      const defU = defenderUnits(G, c, true);
      if (!defU.length) { captureCity(G, s, c, s.units); continue; }
      const r = simulateBattle(toBattleUnits(G, s.units), toBattleUnits(G, defU), siegeCtx(c, s), makeRng(Math.floor(rng() * 1e9)));
      const defOwner = c.owner || null;
      applyAssault(G, s, c, defU, r);
      if (involvesPlayer) G.replays.push({ title: `${c.name} 공성전`, result: r, att: s.att, def: defOwner });
    }
  }
  function aiSiegeOrder(G, s, rng) {
    const c = G.cities[s.to];
    const start = s.startTroops || (s.startTroops = armyTroops(s));
    if (armyTroops(s) < start * 0.3 || s.attMorale < 25) return 'retreat';
    const p = estimateAssault(G, s, rng);
    if (p >= 0.66) return 'assault';
    if (c.wall > c.wallMax * 0.35 && s.turns < 7) return 'sabotage';
    if (s.turns >= 7) return p >= 0.34 ? 'assault' : 'retreat';
    return 'hold';
  }
  function applyBattleLosses(G, list, res, side, won, cityForWounded) {
    let lost = 0;
    list.forEach((u, i) => {
      const after = Math.round(res.units[side][i].troops);
      lost += u.troops - after;
      u.troops = after;
    });
    if (cityForWounded) cityForWounded.wounded += woundedFrom(lost, won);
    return lost;
  }
  function applyField(G, s, c, field, r) {
    const attWon = r.winner === 0;

    let h = `<div class="hd"><h3>${esc(c.name)}</h3><span class="tag">${esc(D.REGIONS[c.region].name)}</span>
      <span class="tag" style="border-color:${fcolor(c.owner)}">${c.owner ? esc(G.factions[c.owner].name) : '공백'}</span>
      ${own ? `<span class="tag">${c.direct ? '직할' : '위임'}</span>` : ''}<button class="sm close" data-act="close">닫기</button></div>`;
    h += `<div class="stats">${st('인구', c.pop)}${st('병력', c.troops)}${st('부상병', c.wounded)}${st('민심', c.loyalty, 100)}
      ${st('농업', c.agri, c.agriMax)}${st('상업', c.comm, c.commMax)}${st('성벽', c.wall, c.wallMax)}${st('훈련', c.train, 100)}
      ${own ? st('금', c.gold) + st('식량', c.food) : ''}</div>`;
    const offs = K.gensIn(G, c.id).filter(g => g.faction && g.faction === c.owner && !g.army);
    const ronin = K.roninIn(G, c.id);
    if (own) {
      h += `<div class="btnrow"><button class="sm" data-act="direct">${c.direct ? '태수에게 맡기기' : '직접 다스리기'}</button>
        <button class="sm pri" data-act="attack" ${attackTargets(c).length && offs.length ? '' : 'disabled'}>출진</button></div>`;
      if (!c.direct) {
        h += `<div class="sec"><h4>태수 방침</h4><select data-act="policy">${Object.entries(POLICY).map(([k, v]) => `<option value="${k}" ${c.policy === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
          ${c.policy === 'atk' ? `<select data-act="target">${['<option value="">목표 선택</option>'].concat(attackTargets(c).map(o => `<option value="${o.id}" ${c.target === o.id ? 'selected' : ''}>${esc(o.name)}</option>`)).join('')}</select>` : ''}
          <p class="hint">태수는 방침에 맞게 장수들에게 일을 나눕니다. 공략 방침은 우세할 때 스스로 출진합니다. 적 세력도 같은 규칙으로 움직입니다.</p></div>`;
      }
      h += `<div class="sec"><h4>장수 ${offs.length}명 ${c.direct ? '— 할 일을 고르세요(계속 유지됩니다)' : ''}</h4>`;
      for (const g of offs) {
        h += `<div class="gen"><span class="nm">${esc(g.name)}${G.factions[c.owner].ruler === g.id ? ' 👑' : ''}${g.virtual ? ' <small class="tag">가상</small>' : ''}</span>`;
        if (c.direct) h += taskSelect(g, c);
        else h += `<span class="tag">${K.TASKS[g.task] || '대기'}</span>`;
        h += `<span class="st">통${g.lead} 무${g.war} 지${g.int} 정${g.pol} · ${aptTxt(g)} · ${G.year - g.birth}세</span></div>`;
      }
      h += `</div>`;
    } else {
      h += `<div class="sec"><h4>장수 ${offs.length}명</h4>${offs.map(g => `<div class="gen"><span class="nm">${esc(g.name)}</span><span></span><span class="st">통${g.lead} 무${g.war} 지${g.int} · ${aptTxt(g)}</span></div>`).join('') || '<p class="hint">수비 장수가 없습니다(향병만 지킴).</p>'}</div>`;
      const from = c.adj.map(id => G.cities[id]).filter(o => o.owner === G.playerFaction);
      if (from.length) h += `<div class="btnrow"><button class="sm pri" data-act="attackFrom">이 도시로 출진</button></div>`;
    }
    if (ronin.length) h += `<div class="sec"><h4>재야 인재</h4>${ronin.map(g => `<div class="gen"><span class="nm">${esc(g.name)}${g.virtual ? ' <small class="tag">가상</small>' : ''}</span><span></span><span class="st">통${g.lead} 무${g.war} 지${g.int} 정${g.pol} · ${aptTxt(g)}</span></div>`).join('')}${own ? '<p class="hint">직할 도시라면 장수의 할 일을 「등용」으로 바꾸세요. 위임 도시는 태수가 알아서 등용을 시도합니다.</p>' : ''}</div>`;
    p.innerHTML = h;
    p.classList.remove('hidden');
    p.onclick = onPanel; p.onchange = onPanel;
  }
  function attackTargets(c) { return c.adj.map(id => G.cities[id]).filter(o => o.owner !== c.owner && !G.sieges.some(s => s.to === o.id && s.att === c.owner)); }
  function taskSelect(g, c) {
    const opts = ['agri', 'comm', 'wall', 'recruit', 'train', 'search', 'rest'];
    let h = `<select data-gen="${g.id}" data-act="task">`;
    for (const t of opts) {
      if (t === 'search' && !G.opts.virtual) continue;
      let label = K.TASKS[t];
      if (t === 'recruit') label += ` (+${fmt(K.recruitAmount(c, g))})`;
      h += `<option value="${t}" ${g.task === t ? 'selected' : ''}>${label}</option>`;
    }
    for (const r of K.roninIn(G, c.id)) h += `<option value="hire:${r.id}" ${g.task === 'hire' && g.arg === r.id ? 'selected' : ''}>등용: ${esc(r.name)}</option>`;
    for (const o of c.adj.map(id => G.cities[id]).filter(o => o.owner && o.owner !== c.owner)) h += `<option value="sabotage:${o.id}" ${g.task === 'sabotage' && g.arg === o.id ? 'selected' : ''}>파괴공작: ${esc(o.name)}</option>`;
    for (const o of K.citiesOf(G, c.owner).filter(o => o.id !== c.id)) h += `<option value="move:${o.id}" ${g.task === 'move' && g.arg === o.id ? 'selected' : ''}>이동: ${esc(o.name)}</option>`;
    return h + '</select>';
  }
  function onPanel(e) {
    const t = e.target, act = t.dataset && t.dataset.act;
    if (!act) return;
    const c = G.cities[sel];
    if (e.type === 'click' && t.tagName === 'SELECT') return;
    if (act === 'close') { sel = null; render(); }
    else if (act === 'direct') { c.direct = !c.direct; render(); }
    else if (act === 'policy' && e.type === 'change') { c.policy = t.value; if (c.policy !== 'atk') c.target = null; render(); }
    else if (act === 'target' && e.type === 'change') { c.target = t.value || null; render(); }
    else if (act === 'task' && e.type === 'change') { const [task, arg] = t.value.split(':'); K.setTask(G, t.dataset.gen, task, arg); persist(); if (!tutEvent({ type: 'task', gen: t.dataset.gen, task })) renderPanel(); }
    else if (act === 'attack') openAttack(c.id, null);
    else if (act === 'attackFrom') openAttack(c.adj.map(id => G.cities[id]).filter(o => o.owner === G.playerFaction).sort((a, b) => b.troops - a.troops)[0].id, c.id);
  }

  // ---------- 출진 ----------
  function openAttack(fromId, toId) {
    const c = G.cities[fromId];
    const targets = attackTargets(c);
    if (!targets.length) return;
    const offs = K.officersIn(G, fromId).sort((a, b) => (b.lead + b.war) - (a.lead + a.war));
    let to = toId && targets.find(o => o.id === toId) ? toId : (inTut() && targets.some(o => o.id === 'xuchang') ? 'xuchang' : targets[0].id);
    const def = K.defaultArmy(G, fromId);
    const rows = offs.map(g => { const d = def.find(u => u.gen === g.id); return { g, on: !!d, type: d ? d.type : K.bestType(g), troops: d ? d.troops : 0 }; });
    const fill = () => {
      const on = rows.filter(r => r.on);
      const pool = Math.floor(c.troops * 0.6);
      const cap = on.reduce((a, r) => a + K.unitCap(r.g), 0) || 1;
      for (const r of rows) r.troops = r.on ? Math.max(100, Math.min(K.unitCap(r.g), Math.floor(pool * K.unitCap(r.g) / cap / 100) * 100)) : 0;
    };
    let tactic = 'normal';
    const draw = () => {
      const tot = rows.reduce((a, r) => a + (r.on ? r.troops : 0), 0);
      const tgt = G.cities[to];
      let h = `<h3>${esc(c.name)}에서 출진</h3>${inTut() ? tutTip(to === 'xuchang' ? '기본으로 채워진 편성 그대로 「출진」을 누르시면 됩니다.' : '목표를 허창으로 바꾸시지요.') : ''}
        <p>목표 <select id="atkTo">${targets.map(o => `<option value="${o.id}" ${o.id === to ? 'selected' : ''}>${esc(o.name)} (${o.owner ? esc(G.factions[o.owner].name) : '공백'}, 병력 ${fmt(o.troops)}, 성벽 ${fmt(o.wall)})</option>`).join('')}</select></p>
        <p class="hint">첫 부대가 총대장입니다. 총대장 부대가 무너지면 나머지 부대 사기가 30 떨어집니다(즉시 패배는 아님). 출진하면 곧바로 성을 포위하고, 다음 턴부터 공격·파괴공작을 고를 수 있습니다. 기병은 사다리를 못 타지만 성문이 깨지면 성 안으로 돌입합니다.</p>`;
      rows.forEach((r, i) => {
        h += `<div class="urow"><label><input type="checkbox" data-i="${i}" data-k="on" ${r.on ? 'checked' : ''}> <b>${esc(r.g.name)}</b></label>
          <span class="hint">통${r.g.lead} 무${r.g.war} · ${aptTxt(r.g)} · 최대 ${fmt(K.unitCap(r.g))}</span>
          ${r.on ? `<div class="ctl"><select data-i="${i}" data-k="type">${['inf', 'arc', 'cav'].map(t => `<option value="${t}" ${r.type === t ? 'selected' : ''}>${D.UNIT[t].name} (${r.g.apt[t]})</option>`).join('')}</select>
          <input type="range" min="100" max="${Math.min(K.unitCap(r.g), c.troops)}" step="100" value="${r.troops}" data-i="${i}" data-k="troops"><b>${fmt(r.troops)}</b></div>` : ''}</div>`;
      });
      const on = rows.filter(r => r.on).length;
      h += `<p>작전 <select id="atkTac"><option value="normal" ${tactic === 'normal' ? 'selected' : ''}>균형</option><option value="charge" ${tactic === 'charge' ? 'selected' : ''}>돌격(주는 피해·받는 피해 +10%)</option><option value="careful" ${tactic === 'careful' ? 'selected' : ''}>신중(둘 다 −10%)</option></select></p>
        <p>출진 병력 <b>${fmt(tot)}</b> / 도시 병력 ${fmt(c.troops)} · 남는 수비 <b>${fmt(Math.max(0, c.troops - tot))}</b> ${tot > c.troops ? '<b style="color:#a8321e">— 병력이 모자랍니다</b>' : ''} ${on > 4 ? '<b style="color:#a8321e">— 부대는 4개까지</b>' : ''}</p>
        <div class="btnrow"><button class="pri" id="atkGo" ${!on || on > 4 || tot > c.troops ? 'disabled' : ''}>출진</button><button id="atkNo">취소</button></div>`;
      openModal(h);
      $('atkTo').onchange = e => { to = e.target.value; draw(); };
      $('atkTac').onchange = e => { tactic = e.target.value; };
      $('modalBox').oninput = e => { const i = e.target.dataset.i; if (i == null) return; if (e.target.dataset.k === 'troops') { rows[i].troops = +e.target.value; e.target.nextElementSibling.textContent = fmt(rows[i].troops); } };
      $('modalBox').onchange = e => {
        const i = e.target.dataset.i; if (i == null) return;
        const k = e.target.dataset.k;
        if (k === 'on') { rows[i].on = e.target.checked; fill(); draw(); }
        else if (k === 'type') rows[i].type = e.target.value;
        else if (k === 'troops') draw();
      };
      $('atkNo').onclick = closeModal;
      $('atkGo').onclick = () => {
        if (!guard()) return;
        const units = rows.filter(r => r.on).map(r => ({ gen: r.g.id, type: r.type, troops: r.troops }));
        const s = K.launchAttack(G, fromId, to, units, tactic);
        if (!s) { toast('출진할 수 없습니다. 병력과 장수를 확인하세요.'); return; }
        closeModal(); sel = tutWide() ? to : null; persist(); render(); tutEvent({ type: 'march' });
        toast(`${K.J(G.cities[to].name, '을', '를')} 포위했습니다. 다음 턴부터 공격·파괴공작을 고를 수 있습니다.`);
      };
    };
    draw();
  }

  // ---------- 턴 종료 ----------
  async function endTurn() {
    if (busy || !G || G.over) return;
    if (!K.tutCanEndTurn(G)) { shakeTut(); return; }
    busy = true; $('btnEnd').disabled = true;
    const mark = G.log[G.log.length - 1];
    K.endTurn(G);
    persist();
    render();
    for (const rp of G.replays.slice()) {
      await showBattle(rp);
      if (inTut() && rp.title.includes(G.cities.xuchang.name)) tutEvent({ type: 'battle', city: 'xuchang', won: G.cities.xuchang.owner === 'cao' });
    }
    const idx = G.log.indexOf(mark);
    const list = G.log.slice(idx + 1);
    showReport(list);
    busy = false; render();
  }
  function showReport(list) {
    const imp = list.filter(x => x.kind !== 'info' || /재야|장성|세상/.test(x.text));
    const rest = list.length - imp.length;
    let h = `<h3>${G.year}년 ${G.month}월 보고</h3>${inTut() ? tutTip('보고서에는 이번 달에 일어난 일이 모입니다. 「확인」을 누르시지요.') : ''}<div class="log">${imp.map(x => `<p class="${x.kind}">${esc(x.text)}</p>`).join('') || '<p>큰 일은 없었습니다.</p>'}</div>`;
    if (rest > 0) h += `<p class="hint">다른 세력 소식 ${rest}건은 메뉴 → 전체 기록에서 볼 수 있습니다.</p>`;
    if (G.over) h += `<h3 style="margin-top:12px">${G.over === 'win' ? '천하 통일!' : '패배'}</h3>`;
    h += `<div class="btnrow"><button class="pri" id="repOk">${G.over ? '처음 화면으로' : '확인'}</button></div>`;
    openModal(h);
    $('repOk').onclick = () => { if (!guard()) return; closeModal(); if (G.over) { title(); return; } if (!tutEvent({ type: 'turn' })) render(); };
  }

  // ---------- 전투 관전 ----------
  function showBattle(rp) {
    return new Promise(resolve => {
      const r = rp.result;
      const meta = r.meta;
      const attName = G.factions[rp.att] ? G.factions[rp.att].name : '?';
      const defName = rp.def && G.factions[rp.def] ? G.factions[rp.def].name : '향병';
      openModal(`<h3>${esc(rp.title)}</h3><div class="bhud"><span style="color:${fcolor(rp.att)}">■</span><b>${esc(attName)}</b> 공격 <span id="bRound"></span> 수비 <b>${esc(defName)}</b><span style="color:${fcolor(rp.def)}">■</span></div>
        <canvas id="bcanvas"></canvas><div class="bhud" id="bInfo"></div>
        <div class="btnrow"><button id="bFast">2배속</button><button id="bSkip" class="pri">결과 보기</button></div>`);
      const cv = $('bcanvas');
      const CELL = 24, BW = K.W * CELL, BH = K.H * CELL;
      cv.width = BW * 2; cv.height = BH * 2; cv.style.aspectRatio = BW + '/' + BH;
      const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.setTransform(2, 0, 0, 2, 0, 0);
      let fi = 0, t0 = performance.now(), speed = 1, done = false, raf = 0;
      const STEP = 520;
      const colors = [fcolor(rp.att), rp.def ? fcolor(rp.def) : '#9a9183'];
      function drawField(f, g, k) {
        ctx.fillStyle = r.siege ? '#7d8a55' : '#6d7f4a'; ctx.fillRect(0, 0, BW, BH);
        ctx.fillStyle = '#00000014';
        for (let x = 0; x < K.W; x++) for (let y = 0; y < K.H; y++) if ((x + y) % 2) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        if (r.siege) {
          ctx.fillStyle = '#a89a80'; ctx.fillRect((K.WALL_X + 1) * CELL, 0, (K.W - K.WALL_X - 1) * CELL, BH);
          for (let y = 0; y < K.H; y++) {
            if (y === K.GATE_Y) {
              ctx.fillStyle = g.gate > 0 ? '#5a3a1e' : '#2a1d10';
              ctx.fillRect(K.WALL_X * CELL + 3, y * CELL, CELL - 6, CELL);
              if (g.gate > 0) { ctx.fillStyle = '#c9452c'; ctx.fillRect(K.WALL_X * CELL + 2, y * CELL + CELL - 4, (CELL - 4) * g.gate, 3); }
              continue;
            }
            ctx.fillStyle = '#8d8270'; ctx.fillRect(K.WALL_X * CELL, y * CELL, CELL, CELL);
            ctx.fillStyle = '#6b604f'; ctx.fillRect(K.WALL_X * CELL, y * CELL, CELL, 3); ctx.fillRect(K.WALL_X * CELL + CELL / 2, y * CELL + CELL / 2, 1, CELL / 2);
          }
          const tw = [0, 7, 1, 6].slice(0, r.towers);
          for (const y of tw) { ctx.fillStyle = '#4a3f33'; ctx.fillRect((K.WALL_X + 1) * CELL + 4, y * CELL + 3, CELL - 8, CELL - 6); ctx.fillStyle = '#d6a53b'; ctx.fillRect((K.WALL_X + 1) * CELL + 9, y * CELL + 7, 6, 4); }
        }
        // 효과
        for (const fx of (g.fx || [])) {
          if (fx.k === 'hit') {
            ctx.strokeStyle = fx.label === 'arc' ? '#f5e6c8cc' : fx.label === 'tower' ? '#ffcf4acc' : '#ff6a4acc'; ctx.lineWidth = fx.label === 'arc' || fx.label === 'tower' ? 1 : 2;
            ctx.beginPath(); ctx.moveTo(fx.from[0] * CELL + CELL / 2, fx.from[1] * CELL + CELL / 2); ctx.lineTo(fx.to[0] * CELL + CELL / 2, fx.to[1] * CELL + CELL / 2); ctx.stroke();
          } else if (fx.k === 'gatebreak') { ctx.fillStyle = '#ffcf4a'; ctx.font = '700 12px sans-serif'; ctx.fillText('성문 돌파!', K.WALL_X * CELL - 20, K.GATE_Y * CELL - 4); }
        }
        g.u.forEach((u, i) => {
          if (u[3]) return;
          const prev = f.u[i];
          const x = (prev[0] + (u[0] - prev[0]) * k) * CELL, y = (prev[1] + (u[1] - prev[1]) * k) * CELL;
          const m = meta[i];
          const col = colors[m.side];
          drawGrid(ctx, SOLDIER[m.type], x + 4, y + 2, 2.2, { 1: shade(col, 0.5), 2: col, 3: shade(col, 0.6), 4: '#c8b48a', 5: '#7a5a30', 6: '#6b4a2b' });
          if (u[4] === 1) { ctx.fillStyle = '#c8a46a'; ctx.fillRect(x + CELL - 4, y + 2, 2, CELL - 4); }
          ctx.fillStyle = '#000a'; ctx.fillRect(x + 1, y + CELL - 4, CELL - 2, 3);
          ctx.fillStyle = m.side === 0 ? '#ffd27a' : '#9fe0ff'; ctx.fillRect(x + 1, y + CELL - 4, (CELL - 2) * u[2] / m.troops0, 3);
          if (m.commander) { ctx.fillStyle = '#ffcf4a'; ctx.fillRect(x + 1, y + 1, 4, 4); }
        });
      }
      function info(g) {
        const sum = side => g.u.reduce((a, u, i) => a + (meta[i].side === side ? u[2] : 0), 0);
        $('bRound') && ($('bRound').textContent = `${g.r}합`);
        $('bInfo').innerHTML = `<span>공격 ${fmt(sum(0))}</span><span>${r.siege ? (g.gate > 0 ? `성문 ${Math.round(g.gate * 100)}%` : '성문 열림') : '야전'}</span><span>수비 ${fmt(sum(1))}</span>`;
      }
      function loop(now) {
        if (done) return;
        const el = (now - t0) * speed;
        fi = Math.min(r.frames.length - 1, Math.floor(el / STEP) + 1);
        const k = Math.min(1, (el % STEP) / (STEP * 0.6));
        const f = r.frames[Math.max(0, fi - 1)], g = r.frames[fi];
        drawField(f, g, fi >= r.frames.length - 1 ? 1 : k);
        info(g);
        if (fi >= r.frames.length - 1 && el > r.frames.length * STEP) return finish();
        raf = requestAnimationFrame(loop);
      }
      function finish() {
        if (done) return; done = true; cancelAnimationFrame(raf);
        const last = r.frames[r.frames.length - 1]; drawField(last, last, 1); info(last);
        const won = r.winner === 0 ? attName : defName;
        const rows = meta.map((m, i) => `<tr><td style="color:${colors[m.side]}">■</td><td>${esc(m.name)}${m.commander ? ' (총대장)' : ''}</td><td>${D.UNIT[m.type].name}</td><td>${fmt(m.troops0)} → ${fmt(last.u[i][2])}</td><td>${last.u[i][3] ? '패주' : ''}</td></tr>`).join('');
        const box = $('modalBox');
        box.querySelector('.btnrow').outerHTML = `<p><b>${esc(won)}</b> 승리 · ${r.rounds}합 · 피해 공격 ${fmt(r.losses[0])} / 수비 ${fmt(r.losses[1])}${r.gateBroken ? ' · 성문 돌파' : ''}</p>
          <table class="mini">${rows}</table><p class="hint">잃은 병력 중 이긴 쪽 40%, 진 쪽 20%는 부상병이 되어 몇 턴 뒤 돌아옵니다.</p>
          <div class="btnrow"><button class="pri" id="bOk">확인</button></div>`;
        modalAt = performance.now();
        $('bOk').onclick = () => { if (!guard()) return; closeModal(); resolve(); };
      }
      $('bFast').onclick = () => { const now = performance.now(); const el = (now - t0) * speed; speed = speed === 1 ? 2 : 1; t0 = now - el / speed; $('bFast').textContent = speed === 1 ? '2배속' : '보통 속도'; };
      $('bSkip').onclick = () => { if (!guard()) return; finish(); };
      raf = requestAnimationFrame(loop);
    });
  }

  // ---------- 메뉴 ----------
  function openMenu() {
    const f = G.factions[G.playerFaction];
    const rows = Object.values(G.factions).filter(x => x.alive).map(x => {
      const cs = K.citiesOf(G, x.id);
      return `<tr><td style="color:${x.color}">■</td><td>${esc(x.name)}</td><td>도시 ${cs.length}</td><td>병력 ${fmt(cs.reduce((a, c) => a + c.troops, 0))}</td><td>장수 ${Object.values(G.gens).filter(g => g.alive && g.faction === x.id).length}</td></tr>`;
    }).join('');
    openModal(`<h3>메뉴</h3>
      <p>세율 <select id="mTax"><option value="low" ${f.tax === 'low' ? 'selected' : ''}>낮음(민심 +1/턴, 금 ×0.7)</option><option value="normal" ${f.tax === 'normal' ? 'selected' : ''}>보통</option><option value="high" ${f.tax === 'high' ? 'selected' : ''}>높음(민심 −1/턴, 금 ×1.35)</option></select></p>
      <p class="hint">3턴마다 각 도시의 남는 금 절반이 수도로 모입니다.</p>
      <table class="mini">${rows}</table>
      <div class="btnrow"><button id="mLog">전체 기록</button><button id="mSave">저장</button><button id="mTut">튜토리얼 다시 보기</button><button id="mTitle">처음 화면</button><button class="pri" id="mClose">닫기</button></div>
      <p class="hint">${VERSION} · 게임은 이 브라우저에 자동 저장됩니다.</p>`);
    $('mTax').onchange = e => { f.tax = e.target.value; persist(); render(); };
    $('mLog').onclick = () => openModal(`<h3>전체 기록</h3><div class="log">${G.log.slice().reverse().map(x => `<p class="${x.kind}">${x.y}.${x.m} ${esc(x.text)}</p>`).join('')}</div><div class="btnrow"><button class="pri" id="lgOk">닫기</button></div>`, () => { $('lgOk').onclick = closeModal; });
    $('mSave').onclick = () => { toast(persist() ? '저장했습니다.' : '저장하지 못했습니다(브라우저 저장소 막힘).'); };
    $('mTitle').onclick = () => { persist(); closeModal(); title(); };
    $('mClose').onclick = closeModal;
    $('mTut').onclick = () => {
      persist();
      if (!inTut()) { closeModal(); startTutorial(); return; }
      openModal(`<h3>연습을 처음부터 할까요?</h3><p>지금 하던 연습(${G.tut.step}/${K.TUT_STEPS.length}단계)은 사라지고 1단계부터 다시 시작합니다.</p>
        <div class="btnrow"><button class="pri" id="mTutYes">처음부터</button><button id="mTutNo">취소</button></div>`);
      $('mTutYes').onclick = () => { if (!guard()) return; closeModal(); startTutorial(); };
      $('mTutNo').onclick = () => { if (guard()) closeModal(); };
    };
  }

  // ---------- 튜토리얼 ----------
  // 순욱 얼굴(16×16 코드 도트, 새로 그림): 관모·젊은 문관·푸른 관복
  const FACE = [
    '......kkkk......',
    '.....kkkkkk.....',
    '..kkkkkkkkkkkk..',
    '....hhhhhhhh....',
    '....ssssssss....',
    '....sesssses....',
    '....ssssssss....',
    '.....sssmsss....',
    '.....ssssss.....',
    '......ssss......',
    '....wwbbbbww....',
    '...bbbwwwwbbb...',
    '..bbbbbwwbbbbb..',
    '..bbbbbbbbbbbb..',
    '.bbbbbbbbbbbbbb.',
    '.bbbbbbbbbbbbbb.',
  ];
  const FACE_PAL = { k: '#1b1712', h: '#2a1f17', s: '#e8c39e', e: '#1b1712', m: '#a8321e', w: '#efe4cc', b: '#2f5d8a' };
  let faceURL = null;
  function faceImg() {
    if (!faceURL) {
      const c = document.createElement('canvas'); c.width = 16; c.height = 16;
      drawGrid(c.getContext('2d'), FACE, 0, 0, 1, FACE_PAL);
      faceURL = c.toDataURL();
    }
    return `<img class="face" src="${faceURL}" alt="순욱">`;
  }
  const tutWide = () => window.innerWidth >= 900;
  const tutId = () => (inTut() ? K.TUT_STEPS[G.tut.step - 1].id : null);
  function tutTip(t) { return `<div class="tutline tip">${faceImg()}<p>${esc(t)}</p></div>`; }
  function tutTargetCity() {
    const id = tutId();
    if (id === 'openCap') return 'chenliu';
    if (id === 'delegate') return 'puyang';
    if ((id === 'march' || id === 'recruit') && sel !== 'chenliu') return 'chenliu';
    return null;
  }
  // 지금 단계에서 밝게 강조할 화면 요소
  function tutTargetEl() {
    const id = tutId();
    if (id === 'recruit') return document.querySelector(`#panel select[data-gen="${K.tutRecruiter(G)}"]`);
    if (id === 'endTurn1' || id === 'siege') return $('btnEnd');
    if (id === 'march' && sel === 'chenliu') return document.querySelector('#panel [data-act="attack"]');
    if ((id === 'assault' || id === 'siege') && sel && !tutWide()) return document.querySelector('#panel [data-act="close"]');
    if (id === 'assault') {
      const s = G.sieges.find(x => x.att === 'cao' && x.to === 'xuchang');
      return s && s.order === 'assault' ? $('btnEnd') : document.querySelector('#sieges button[data-o="assault"]');
    }
    if (['intro', 'hud', 'stats', 'victory'].includes(id)) return $('tutNext');
    return null;
  }
  function renderTut() {
    const box = $('tut');
    document.querySelectorAll('.tut-hl').forEach(el => el.classList.remove('tut-hl'));
    $('btnEnd').disabled = busy || (!!G && !K.tutCanEndTurn(G));
    if (!inTut()) { box.classList.add('hidden'); $('sieges').style.top = ''; return; }
    const st = K.TUT_STEPS[G.tut.step - 1];
    let todo = st.todo;
    if (st.id === 'assault') {
      const s = G.sieges.find(x => x.att === 'cao' && x.to === 'xuchang');
      const odds = s ? K.assaultOdds(G, s, 12) : 0;
      if (G.tut.retry) todo = '아쉽게 물러났습니다. 다시 치시지요 — ' + todo;
      if (odds < 0.9) todo = `예상 승률 ${Math.round(odds * 100)}%로는 이르니, 한 턴 더 에워싸거나 「공작」을 쓰시지요 → 「턴 종료」`;
      else if (s && s.order === 'assault') todo = '이제 위쪽 「턴 종료」를 누르세요';
    }
    if (st.id === 'march' && sel === 'chenliu') todo = '진류 창의 「출진」을 누르세요';
    if (st.id === 'recruit') {
      const who = K.tutRecruiter(G);
      if (who && who !== 'xiahoudun') todo = `하후돈 장군은 이미 출진했으니, ${G.gens[who].name}의 할 일을 「징병」으로 바꾸세요`;
      if (sel !== 'chenliu') todo = '먼저 지도에서 진류 성을 누르고, ' + todo;
    }
    if ((st.id === 'assault' || st.id === 'siege') && sel && !tutWide()) todo = '아래 도시 창을 「닫기」로 닫고 위쪽 포위 판을 보세요';
    const needNext = ['intro', 'hud', 'stats', 'victory'].includes(st.id);
    box.innerHTML = `<div class="tutline">${faceImg()}<div><p class="say">${esc(st.say)}</p><p class="todo">▶ ${esc(todo)}</p></div></div>
      <div class="tutbar"><span>${G.tut.step}/${K.TUT_STEPS.length}</span><span>
      ${needNext ? `<button class="sm pri" id="tutNext">${st.id === 'victory' ? '연습 마치기' : '다음'}</button>` : ''}
      <button class="sm" id="tutSkip">건너뛰기</button></span></div>`;
    box.classList.remove('hidden');
    if (needNext) $('tutNext').onclick = () => tutEvent({ type: 'next' });
    $('tutSkip').onclick = () => tutFinish(true);
    $('sieges').style.top = tutWide() ? '' : (box.offsetHeight + 16) + 'px';
    const el = tutTargetEl(); if (el) el.classList.add('tut-hl');
  }
  function shakeTut() {
    const b = $('tut'); if (b.classList.contains('hidden')) return;
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }
  // 사건을 넘기고 단계가 바뀌면 다시 그린다. 바뀌었으면 true
  function tutEvent(ev) {
    if (!inTut()) return false;
    const changed = K.tutCheck(G, ev);
    if (!changed) { if (ev.type === 'task') shakeTut(); return false; }
    persist();
    if (G.tut.done) { tutFinish(false); return true; }
    render();
    return true;
  }
  // 연습을 끝내거나 건너뛰면: 이 판을 계속하기 / 새 게임
  function tutFinish(skipped) {
    if (skipped) K.tutSkip(G); else K.tutDone(G);
    persist();
    render();
    openModal(`<h3>${skipped ? '연습을 건너뛰었습니다' : '연습을 마쳤습니다'}</h3>${tutTip(skipped ? '언제든 메뉴의 「튜토리얼 다시 보기」로 돌아오실 수 있습니다.' : '이제 휴전이 풀렸습니다. 다른 군웅들도 우리를 노릴 것이니 성을 비우지 마시지요.')}
      <div class="btnrow"><button class="pri" id="tutKeep">이 판을 계속하기</button><button id="tutNew">새 게임 시작</button></div>`);
    $('tutKeep').onclick = () => {
      if (!guard()) return;
      const keep = () => {
        G.tut.kept = true;
        if (!storeSet(K.save(G))) { G.tut.kept = false; toast('저장하지 못했습니다(브라우저 저장소가 가득 찼거나 막힘). 연습 판은 그대로 남겨 둡니다.'); return; }
        storeDel(TUT_KEY); closeModal(); render(); toast('이 판을 본 게임으로 이어 갑니다.');
      };
      if (!storeGet()) return keep();
      openModal(`<h3>진행 중인 판이 있습니다</h3><p>이어하던 본 게임 저장을 이 연습 판으로 덮어쓸까요? 덮어쓰면 예전 판은 되돌릴 수 없습니다.</p>
        <div class="btnrow"><button class="pri" id="tutOver">덮어쓰기</button><button id="tutBack">취소</button></div>`);
      $('tutOver').onclick = () => { if (guard()) keep(); };
      $('tutBack').onclick = () => { if (guard()) tutFinishAgain(skipped); };
    };
    $('tutNew').onclick = () => { if (!guard()) return; storeDel(TUT_KEY); closeModal(); G = null; title(); showPick(); };
  }
  function tutFinishAgain(skipped) { G.tut.done = true; tutFinish(skipped); }

  // ---------- 공통 ----------
  function openModal(html, after) { $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); modalAt = performance.now(); $('modalBox').scrollTop = 0; if (after) after(); }
  function closeModal() { $('modal').classList.add('hidden'); $('modalBox').oninput = null; $('modalBox').onchange = null; }
  function guard() { return performance.now() - modalAt > 350; } // 창이 열린 직후 잘못 누르기 방지
  function toast(t) { const d = document.createElement('div'); d.textContent = t; $('toast').appendChild(d); setTimeout(() => d.remove(), 3200); }

  // ---------- 시작 ----------
  $('btnNew').onclick = showPick;
  $('btnLoad').onclick = () => { const s = storeGet(); if (!s) return; try { G = K.load(s); sel = G.factions[G.playerFaction]?.capital || null; enterGame(); } catch (e) { toast('저장을 불러오지 못했습니다.'); } };
  $('btnEnd').onclick = endTurn;
  $('btnMenu').onclick = openMenu;
  $('map').addEventListener('click', e => {
    if (!G) return;
    const r = $('map').getBoundingClientRect();
    const c = cityAt(e.clientX - r.left, e.clientY - r.top);
    sel = c ? c.id : null;
    if (c && tutEvent({ type: 'select', city: c.id })) return;
    if (c && inTut() && ['openCap', 'delegate'].includes(tutId())) shakeTut();
    render();
  });
  window.addEventListener('resize', () => G && drawMap());
  $('btnTut').onclick = loadTutorial;
  // 지도의 금색 고리를 깜빡이게 한다(튜토리얼 대상 도시가 있을 때만)
  setInterval(() => { if (G && tutTargetCity() && !$('game').classList.contains('hidden') && $('modal').classList.contains('hidden')) drawMap(); }, 100);
  // 시험용: 도시의 화면 좌표
  const cityXY = id => { const r = $('map').getBoundingClientRect(), c = G.cities[id]; return [r.left + mapT.ox + c.x * mapT.s, r.top + mapT.oy + c.y * mapT.s]; };
  window.__gunung = { get G() { return G; }, K, endTurn, openAttack, cityXY };
  title();
})();
</script>
</body>
</html>
